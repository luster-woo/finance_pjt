# 운영 구성. 외부에 열리는 포트는 nginx 의 80 뿐이다.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env.prod 확인 필요}
      POSTGRES_USER: ${POSTGRES_USER:?.env.prod 확인 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.prod 확인 필요}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: BE/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DEBUG: 'False'
      RUN_SCHEDULER: 'False'
      POSTGRES_HOST: db
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8000'

  # 스케줄러는 워커가 여러 개인 web 과 분리한다. 중복 실행 방지.
  sched:
    build:
      context: .
      dockerfile: BE/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DEBUG: 'False'
      RUN_SCHEDULER: 'True'
      SKIP_INIT: '1'
      POSTGRES_HOST: db
      MEDIA_ROOT: /app/media
    volumes:
      - media_volume:/app/media
    command: ['python', 'manage.py', 'run_scheduler']
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./FE
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/vol/static:ro
      - media_volume:/vol/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  static_volume:
  media_volume:
