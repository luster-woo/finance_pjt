upstream backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # 프로필 이미지 업로드용. 기본값 1MB.
    client_max_body_size 10M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # proxy_pass 끝의 슬래시가 /api 접두사를 제거한다. Django urls.py 에는 /api 가 없다.
    location /api/ {
        proxy_pass http://backend/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    75s;
    }

    # 슬래시 없는 /api 가 SPA 블록으로 새는 것 방지
    location = /api {
        return 404;
    }

    location /admin/ {
        proxy_pass http://backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # collectstatic / 업로드 파일은 볼륨을 통해 nginx 가 직접 서빙한다.
    location /static/ {
        alias /vol/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /vol/media/;
        expires 7d;
    }

    # 파일명에 해시가 붙으므로 길게 캐시해도 된다.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # vue-router history 모드 폴백
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
